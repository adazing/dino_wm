defaults:
  - _self_
  - planner: cem   # dino-wm pusht default. Use mpc_cem for closed-loop / plan_to_end
  - override hydra/launcher: submitit_slurm

hydra:
  run:
    dir: plan_outputs/${now:%Y%m%d%H%M%S}_${replace_slash:${model_name}}_gH${goal_H}
  sweep:
    dir: plan_outputs/${now:%Y%m%d%H%M%S}_${replace_slash:${model_name}}_gH${goal_H}
    subdir: ${hydra.job.num}
  launcher:
    submitit_folder: ${hydra.sweep.dir}/.submitit/%j
    nodes: 1
    tasks_per_node: 1
    cpus_per_task: 16
    mem_gb: 256
    gres: "gpu:h100:1"
    qos: "explore"
    timeout_min: 720
    setup: ["export DEBUGVAR=$(scontrol show hostnames $SLURM_JOB_NODELIST)",
            export MASTER_ADDR="$(scontrol show hostnames $SLURM_JOB_NODELIST | head -n 1)",
            "export MASTER_PORT=$(for port in $(shuf -i 30000-65500 -n 20); do if [[ $(netstat -tupln 2>&1 | grep $port | wc -l) -eq 0 ]] ; then echo $port; break; fi; done;)",]

# model to load for planning.
ckpt_base_path: /nas/ada/dev/dino_wm/pretrained_models/   # REQUIRED, dir holding outputs/. Model loads from ${ckpt_base_path}/outputs/${model_name}
model_name: pusht   # REQUIRED. The pusht WM run folder under outputs/
model_epoch: latest

seed: 99
# Make world-model rollouts inside the planner reproducible. Slower.
deterministic: false
n_evals: 50
# Where planning gets its init and goal pairs.
#   dset           demo trajectory, goal frameskip * goal_H frames ahead
#   random_state   sampled from the env itself with no reference to any demo
#   random_action  random action sequence rolled out to define the goal
#   valid          demo from the valid split
#   train          demo from the train split
#   file           read from goal_file_path
goal_source: 'dset'   # standalone plan.py only, 'random_state' / 'dset' / 'random_action'. generate_planned_trajectories.py sets this itself.
goal_H: 5   # how far the goal is (in WM steps) when plan_to_end is false
n_plot_samples: 10

# --- generate_planned_trajectories.py, trajectory selection ---
# Which split planning samples its init and goal pairs from.
#   train       demos from the train split
#   val         held-out demos never trained on
#   both        train and val concatenated
#   eval_pairs  reproduce the exact episodes the BC eval scores on
source_split: eval_pairs
eval_split: valid   # eval_pairs only, split the eval draws goals from (valid | train)
# Plan to the demo's final frame instead of a fixed goal_H ahead. Not compatible with provided_states_path.
plan_to_end: false
# restrict planning to the FIRST N source demos.
source_max_trajectories: null
# --- SHARED seeded-random segment selection, mirror of train_policy's original_* knobs -------
# When original_subset_seed or original_segment_length is set, generation plans from a
# seeded-random set of windows instead of source_max_trajectories, the SAME windows BC-original
# trains on, so the planned-vs-raw comparison is on identical source segments.
#   original_segment_length, FRAMES per window.
#   original_subset_seed, seed for the random trajectory+offset pick (null = first-N, offset 0).
original_max_trajectories: null
original_segment_length: null
original_subset_seed: null
# how many trajectories to generate, null -> n_planning_rounds*n_evals, 'dataset' -> exactly
# len(train).
num_trajectories: 10000
# How trajectories are drawn from the source split.
#   sequential               in index order
#   random                   uniform at random, no repeats
#   random_with_replacement  independent draws, duplicates allowed
sample_mode: random_with_replacement
# source_split=eval_pairs only, reproduce the BC eval's seeded episodes (train_policy.py:1034).
eval_seed: 42   # the BC run's cfg.seed (the eval draws Random(eval_seed + episode_idx))
n_eval_episodes: 100   # the eval's episode count = (n_env_evals // n_envs) * n_envs
eval_goal_offset: null   # null -> frameskip*goal_H. Must equal it (the eval's goal_offset)
# optional, a train_probe.py probe checkpoint (probe_<rep>.pt).
probe_ckpt: /nas/ada/dev/dino_wm/probe_outputs/20260720235332_pusht_noise_dino/checkpoints/probe_pooled.pt
# Roll the plan out in imagination instead of the real env. Must stay false to produce usable data.
dream: true

# plan_to_end + MPC safety, cap replanning iterations so an unreachable goal can't loop forever
mpc_max_iter: 100

debug_dset_init: False

objective:
  _target_: planning.objectives.create_objective_fn
  alpha: 1
  base: 2   # coeff base for weighting all frames. Only applies when mode == 'all'
  mode: last

# --- generate_planned_trajectories.py only (ignored by plan.py) ---
n_planning_rounds: 10000   # number of planning rounds. Total trajs = rounds * n_evals (here 2000*10=20000)
planned_out_path: ./planned_pusht.pth
# Train only on planned trajectories that reached their goal.
planned_only_successes: false   # keep only trajectories that reached the goal
# wandb logging for generation, per-round success_rate, cumulative reached rate, timing.
wandb_logging: true
wandb:
  project: dino_wm_planning
  entity: null   # wandb username/team, or null for the default

# incremental save, 0 = accumulate all in RAM and write one.pth at the end, fine for small runs.
shard_every: 1

# how often the evaluator saves visuals to the Hydra run dir.
save_figure_every: 50   # env-vs-imagined comparison.png
save_video_every: 50   # rollout.mp4 videos

# replace the dataset path saved in the WM config.
override_dataset_path: /nas/ada/dev/dynamo/data/dynamo_repro_datasets/pusht_dataset
