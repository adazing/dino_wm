name: pusht
args: []
kwargs:
  with_velocity: true
  with_target: true
  # Appearance shift (env/env_shift.py). null keeps the original rendering. Colours take
  # anything pygame.Color accepts: a name, '#rrggbb', or an (r, g, b) tuple. `shape` is listed
  # for completeness, but prefer eval_env_override.shape: update_env re-applies the dataset's
  # recorded shape at eval and generation time and would overwrite this.
  shape: null                 # T (trained) | L | Z | + | I | square | small_tee
  color: null                 # pushed block, AdaJEPA "redBlock"; default LightSlateGray
  agent_color: null           # circular pusher, AdaJEPA "redAgent"; default RoyalBlue
  goal_color: null            # fixed anchor T, AdaJEPA "redAnchor"; default LightGreen
  obs_corruption: null        # blur | snp1 | snp5 | dark
  obs_corruption_level: null  # per-corruption default when null

# action / goal / view dims for the BC policy
act_dim: 2
goal_dim: 0
views: 1
# pusht exposes a built-in task goal + coverage, final_coverage in step info, so a 'task' eval
# pass reports coverage/reward (unless goal_source=random_state).
has_coverage: true

# The DATASET is chosen separately via the `dataset` config group (dataset=pusht | pusht_noise),
# so the same pusht env can train/eval on either.
dataset: ${dataset}

decoder_path: null
num_workers: 16
