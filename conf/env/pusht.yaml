name: pusht
args: []
kwargs:
  with_velocity: true
  with_target: true

# action / goal / view dims for the BC policy
act_dim: 2
goal_dim: 0
views: 1
# pusht exposes a built-in task goal + coverage, final_coverage in step info, so a 'task' eval
# pass reports coverage/reward (unless goal_source=random_state).
has_coverage: true

# The DATASET is chosen separately via the `dataset` config group (dataset=pusht | pusht_noise),
# so the same pusht env can train/eval on either.
dataset: ${dataset}

decoder_path: null
num_workers: 16
