name: wall
args: []
# sample_padding is the clearance generate_random_state keeps from the wall and the borders when
# it samples init/goal pairs.
#   0  removes the guarantee, leaving only enough room to stay out of solid geometry.
kwargs:
  sample_padding: null

# action / goal / view dims for the BC policy
act_dim: 2
goal_dim: 0
views: 1
# wall has no coverage, a 'task' eval pass reports eval_state success/distance, like a goal pass.
has_coverage: false

# DATASET chosen via the `dataset` group, use dataset=wall with this env.
dataset: ${dataset}

decoder_path: null
num_workers: 16
