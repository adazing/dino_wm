name: wall
args: []
kwargs: {}

# action / goal / view dims for the BC policy
act_dim: 2
goal_dim: 0
views: 1

dataset:
  _target_: "datasets.wall_dset.load_wall_slice_train_val"
  n_rollout: null
  normalize_action: ${normalize_action}
  data_path: ${oc.env:DATASET_DIR}/wall_single
  split_ratio: 0.9
  split_mode: "random"
  transform:
    _target_: "datasets.img_transforms.default_transform"
    img_size: ${img_size}

decoder_path: null
num_workers: 16