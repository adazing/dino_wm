defaults:
  - _self_
  - env_vars: env_vars
  - env: wall
  # dataset for the env, pusht | pusht_noise | wall.
  - dataset: wall
  - encoder: dino_avg_pool
  - policy: vqbet
  - override hydra/launcher: submitit_slurm

# Which trajectories the policy trains on.
#   original  demonstrations only
#   planned   world-model planned trajectories only
#   both      concatenated, weighted by window count rather than 50/50
data_source: original
# Planned trajectories produced by generate_planned_trajectories.py. Either a single .pth
# file or a shard directory when generated with shard_every > 0.
planned_data_path: null
# Train only on planned trajectories that reached their goal.
planned_only_successes: false   # keep only trajectories that reached the goal (needs 'successes' metadata)
planned_max_trajectories: null   # cap how many planned trajectories to use, after filtering. Null = all
# WHICH planned trajectories the cap keeps once the pool exceeds it.
planned_selection: first
planned_selection_seed: 0
# --- original-data subset (data_source original/both) --------------------------------------
# original_max_trajectories, how many original trajectories/segments to use.
original_max_trajectories: null
original_segment_length: null
original_subset_seed: null

# condition the policy on a goal image.
goal_conditional: true
# goal source when goal_conditional=true
#   future_conditional=false -> the trajectory's final frame (hindsight endpoint)
#   future_conditional=true  -> a frame/clip sampled from ahead in the trajectory
future_conditional: true
min_future_sep: ${action_window_size}   # min gap between window and the sampled goal
future_seq_len: 1   # number of future frames forming the goal
only_sample_tail: false   # if true, always use the last future_seq_len frames

# dataset / windows
img_size: 224
normalize_action: true
num_hist: 1   # only used by the env dataset loader signature
num_pred: 1
frameskip: 1   # BC policy uses per-step actions
window_size: 5   # obs history length (obs_horizon)
action_window_size: 5
train_fraction: 0.95
seed: 42
# Make world-model rollouts inside the planner reproducible. Slower.
deterministic: false
# precompute_embeddings true, encode the whole dataset once into RAM (fast, but memory grows with
# dataset size).
precompute_embeddings: true
embed_device: cpu   # where precomputed embeddings are cached (precompute only)

# optim / training
optim:
  lr: 5.5e-5
  weight_decay: 2e-4
  betas: [0.9, 0.999]
batch_size: 16
epochs: 5000
# One epoch = this many windows, drawn with replacement, instead of one pass over the dataset.
# null = one pass, which is the right unit for OVERFITTING (each example is revisited `epochs`
# times whatever the dataset size); pinning it equalises compute instead, which makes revisit
# counts differ by orders of magnitude between a small planned pool and data_source=both. Left
# here for runs that deliberately want a fixed step budget.
windows_per_epoch: null
# Which eval metric picks checkpoints/model_best.pt, and whether higher or lower is better. The key
# is "<eval pass>/<metric>" exactly as it appears in the "eval_on_env: {...}" log lines. null = off,
# only model_final.pt is written. dagger_loop.py carries model_best.pt into the next round.
# null since 2026-11-24. Wall no longer runs a goal25_valid pass (M11), so this key named a
# metric that never appears and model_best.pt would never be written. Nothing is lost:
# policy_ckpt_select defaults to 'final', so no checkpoint is selected by rollout at all. The
# per-pass bests are still logged under best/... regardless of this key.
select_metric: null
select_mode: max
num_workers: 8
save_every: 50
eval_freq: 10   # validation action-loss every N epochs

# Start from a prior train_policy.py checkpoint (a checkpoints/model_*.pt).
checkpoint: null
# resume, true -> RESTART the same run on the SAME data, load model + optimizer + epoch and
# continue the same wandb run, pick up where it left off.
#   false -> FINETUNE on NEW data, load model WEIGHTS only.
resume: false

# closed-loop env eval.
eval_on_env: true
# DEFAULT env-eval init/goal source when a pass omits goal_source (per-pass goal_source
# overrides).
#   train | valid       -> the MAIN (trained-on) dataset.
#   eval_train | eval_valid -> the SEPARATE eval_task_dataset's own train | valid split.
#   random_state        -> init/goal sampled from the env.
eval_goal_source: valid
# --- alternate dataset for 'task' passes ONLY, goal passes always use the main env dataset ------
# eval_task_dataset picks where 'task' passes draw init/goal + goal-images from.
#   null           -> reuse the main env dataset, loaded ONCE, the default.
#   a group NAME   -> a config from conf/dataset/, pusht | pusht_noise | wall.
eval_task_dataset: null
eval_on_env_freq: 50
n_env_evals: 100   # must be a multiple of n_envs
n_envs: 10
eval_horizon: 300   # default env steps/episode (pusht max_episode_steps=300). Used only when eval_passes is empty
# Where a demo-goal eval pass gets its goal image.
#   env      drawn by the same renderer that draws the observations
#   dataset  stored frame
eval_goal_render: env
# eval goal = this many env-frames ahead of the start.
eval_goal_offset: null
# Short-goal (type, goal) passes start at a RANDOM offset into each trajectory with the goal
# goal_offset frames ahead of it, like dino-wm's sampling / BC's windowed training, instead of
# always frame 0 -> tests diverse start states, not just the first segment.
eval_goal_random_start: true
# Eval passes, each runs a full closed-loop eval, logged under "<name>/..." in wandb.
#   type, goal -> condition on the frame goal_offset ahead.
#   type, task -> condition on the FINAL frame.
#   train       -> the EXACT trajectories BC trained on (MAIN dataset's data_source split.
#   valid       -> the MAIN env dataset's held-out valid split, real demos never trained on.
#   eval_train  -> the SEPARATE eval_task_dataset's own TRAIN split (needs eval_task_dataset.
#   eval_valid  -> the SEPARATE eval_task_dataset's own VALID split (needs eval_task_dataset.
#   random_state-> init/goal SAMPLED FROM THE ENV.
eval_passes:
  # short-goal on held-out demos, goal 25 frames ahead, long horizon so a slightly-off rollout has
  # room to recover.
  - {name: goal25_valid,   type: goal, goal_offset: 25, horizon: 100, goal_source: valid}
  # short-goal on the EXACT trajectories BC trained on, same inits it saw.
  - {name: goal25_train,  type: goal, goal_offset: 25, horizon: 100, goal_source: train}
  # short-goal on the SEPARATE eval_task_dataset's splits (needs eval_task_dataset set), - {name,
  # goal25_evalvalid, type, goal, goal_offset, 25, horizon, 300, goal_source, eval_valid} - {name,
  # goal25_evaltrain, type, goal, goal_offset, 25, horizon, 300, goal_source, eval_train}
  # env-sampled random init/goal, scored by success/distance.
  - {name: reach_rs,      type: goal, horizon: 100, goal_source: random_state}
  # pusht, full-task coverage on real full episodes, valid, or eval_valid for the other dataset.
save_eval_video: true
n_eval_videos: 10   # how many random episodes to record per eval (<= n_env_evals)
# true -> film the SAME random episodes every eval, watch fixed scenes improve over epochs false
# -> a fresh random set of episodes each eval (variety)
eval_video_fixed: false
eval_video_fps: 12

wandb:
  project: dino_wm_bc
  entity: null
  # Run identity in the wandb UI.
  #   group  runs sharing a group collapse into one row. WITHIN a project only
  name: null
  group: null
  job_type: null
  tags: []
# Run every env in this process instead of forked subprocesses. Slower but avoids EGL failures under fork.
serial_env: false
# How env worker processes are created.
#   null        fork, the Python default
#   fork        copies this process, fast, but EGL state does not survive the copy
#   spawn       fresh interpreter per worker, needed for MuJoCo envs that render
#   forkserver  children fork from one clean server process
env_start_method: null

wandb_logging: true
experiment: ${policy._target_}_${data_source}

hydra:
  job:
    chdir: true   # cd into the run dir, Hydra 1.2 defaults this to false. Without it
                  # os.getcwd() stays the launch dir and outputs land in the base folder
  run:
    # descriptive, unique per-run dir.
    dir: ./policy_outputs/${now:%Y%m%d%H%M%S}_${env.name}_${hydra:runtime.choices.encoder}_${hydra:runtime.choices.policy}_${data_source}_gc${goal_conditional}

# Test-time environment shift: layout keys merged over the dataset's own per-trajectory
# env_info, so evaluation can run in a different environment from the training data. Read by
# env_shift.parse_override; {} means no shift. Appearance shifts are env.kwargs instead.
# Requires eval_goal_render='env' (the default) -- with 'dataset' the goal picture would show
# the unshifted world and train_policy refuses to run.
eval_env_override: {}

# --- offline checkpoint selection (no simulator) ------------------------------------------------
# select_metric above may name ANY key the offline eval produces, in which case the checkpoint is
# chosen without a single environment rollout. The keys are
# "offline/<split>/<metric>", where <split> is all | success | fail and <metric> is one of:
#
#   exec_mse            MSE on the action the rollout ACTUALLY executes (element 0 of the last
#                       predicted chunk). The most rollout-relevant single number here, because
#                       the other eight slots in a window are predicted and then discarded.
#   exec_mse_p90        the 90th percentile of the same per-window error. A mean hides the rare
#                       large errors that are the ones that actually end an episode.
#   exec_mse_frac_bad   the fraction of windows whose error exceeds select_err_threshold.
#   chunk_mse           MSE over the whole executed chunk, plus _p90 / _frac_bad.
#   offset_loss         the model's own L1 term over the full chunk.
#   classification_loss the VQ codebook cross-entropy term.
#   total_loss          the model's own total loss.
#   code_err            1 - (both codebook heads agreeing), so lower is better like the rest.
#   n_windows           how many windows the split contributed, for sanity-checking.
#
# EVERY key is "lower is better", so pair any of them with select_mode: min.
#
# select_holdout_path MUST be a fixed directory of planned shards that is never trained on and
# never added to. Pointing it at the live pool defeats the purpose: the pool gains shards every
# round, so the metric's data changes underneath it and rounds stop being comparable.
select_holdout_path: null
# which splits to build. "success" keeps only trajectories where the planner reached its goal,
# "fail" only those where it did not; selecting on one or the other is a deliberate choice about
# which errors should count.
select_holdout_splits: [all, success, fail]
# cap the holdout size for speed (null = all of it). Applied in file order, never reseeded.
select_holdout_max_trajectories: null
# how often to run the offline eval, in epochs. null = eval_freq.
select_offline_freq: null
# the *_frac_bad threshold, in the same units as exec_mse. null = do not report frac_bad.
select_err_threshold: null
# cap batches per split for speed (null = the whole split).
select_max_batches: null
# the codebook index is SAMPLED, not argmaxed (bet.py:_sample_action uses torch.multinomial), so
# the offline eval reseeds to this value before every pass. That makes the metric a deterministic
# function of the weights, which selection requires. Keep it fixed across arms and rounds.
select_sample_seed: 12345

# --- weight averaging, instead of selecting an epoch (M2) -------------------------------------
# Measured 2026-11-23 over 39 rounds of four wall arms: the held-out action loss correlates with
# goal25_valid/max_success_rate at Spearman only -0.31, so no offline metric here is a trustworthy
# selector. Averaging has no selector, so there is nothing to leak and no proxy to validate.
#   null      -> off, behave as before
#   uniform   -> equal weight to every snapshot (SWA; Izmailov et al. 2018)
#   ema       -> exponentially weighted, recent snapshots count more. This is the form standard in
#                imitation learning: the diffusion-policy family (BESO, DiWA) uses EMA weights at
#                inference, and this repo already calls ema_step() on its diffusion path.
# Snapshots are taken from the LIVE weights after each epoch, so save_every does not limit how
# many the average gets. Set policy_ckpt_select: avg in the dagger config to carry it forward.
policy_weight_avg: null
weight_avg_every: 1          # snapshot every N epochs
weight_avg_start_epoch: 0    # skip the first N epochs; 0 includes the warm-started starting point,
                             # which matters because 19 of 39 measured rounds peaked at epoch 0
weight_avg_ema_power: 0.6667 # ema only; the diffusion path's default is 2/3

# E5: stop an evaluation episode once every environment in the batch has reached its goal. The
# reported metric is max_success_rate, "reached at any step", so steps after that cannot change it.
# It DOES change final_success_rate and final_goal_dist, neither of which this project uses. Set
# false to run the full eval_horizon regardless.
eval_break_on_success: true
