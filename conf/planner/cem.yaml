_target_: planning.cem.CEMPlanner
horizon: 5
topk: 30
num_samples: 300
var_scale: 1

# Bound on |action| during the search, in the dataset's normalised space where
# demonstrations are std 1 centred on 0. null = unbounded, the original behaviour.
action_clamp: null

opt_steps: 30
eval_every: 1

# opt-in early-stop (both null = off -> run all opt_steps, unchanged default), stop_loss_thresh,
# break when EVERY trajectory's best imagined objective <= this value (the WM thinks all plans
# reached the goal).
stop_loss_thresh: null
patience: null
min_delta: 0.00

name: cem
