_target_: planning.mpc.MPCPlanner
# A CAP, not a target: the plan loop exits early as soon as every episode succeeds. null meant
# np.inf, so a single never-solvable episode pinned a GPU indefinitely. 20 iters x
# n_taken_actions 5 = 100 env steps, 4x the 25-step budget (goal_H 5 * frameskip 5) used
# elsewhere, so this only fires on genuinely stuck episodes.
max_iter: 20
n_taken_actions: 5
sub_planner:
  target: planning.cem.CEMPlanner
  horizon: 5
  topk: 30
  num_samples: 300
  var_scale: 1
  opt_steps: 30
  eval_every: 1
  # opt-in early-stop for the inner CEM (both null = off).
  stop_loss_thresh: null
  patience: null
  min_delta: 0.0

name: mpc_cem
